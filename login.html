<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Battambang:wght@100;300;400;700;900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!-- Bootstrap Icon link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="sec-authentication py-3 py-lg-5 p-lg-5">
        <!-- Background -->
        <div class="background">
            <div class="blur blur-1"></div>
            <div class="blur blur-2"></div>
            <div class="blur blur-3"></div>
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
        </div>
        <div class="container mb-5">
            <div class="row">
                <div class="col-12 col-lg-6">
                    <div class="mt-5 d-flex justify-content-evenly align-items-center">
                        <h1 class="title fw-bold">សូមស្វាគមន៍មកកាន់ <br><span class="text-success">Khmer<span class="bazaar"> Bazaar</span>.</span></h1>
                        <img src="assets/img/logo-removebg-preview.png" class="img-logo" alt="">
                    </div>
                    <img src="assets/img/seller_images/Ecommerce web page-bro.png" class="w-100" alt="">
                </div>
                <div class="col-12 col-lg-6">
                    <div class="card border-0 shadow-lg">
                        <div class="card-body">
                            <h2 class="text-center login-title fw-bold bazaar mb-5">ចូលប្រើប្រាស់</h2>
                            <form action="seller_da.html" method="GET" class="needs-validation" novalidate>
                                <div class="mb-4">
                                    <input type="email" class="form-control" placeholder="បញ្ចូលអុីម៉ែល"
                                        required>
                                    <div class="invalid-feedback">សូមបំពេញអុីម៉ែល</div>
                                </div>
                                <div class="mb-4 input-container">
                                    <input type="password" class="form-control input" placeholder="បញ្ចូលពាក្យសម្ងាត់" required>
                                    <i class="bi bi-eye-slash eye-icon"></i>
                                    <div class="invalid-feedback">សូមបំពេញពាក្យសម្ងាត់</div>
                                </div>
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <div>
                                        <input type="checkbox" class="form-check-input" id="remember">
                                        <label class="ms-1" for="remember">ចងចាំខ្ញុំ</label>
                                    </div>
                                    <a href="forgot_pw.html" class="link text-success">ភ្លេចពាក្យសម្ងាត់?</a>
                                </div>
                                <button type="submit" class="btn btn-login w-100 mb-3">ចូលប្រើ</button>
                                <div class="register-section text-center">
                                    <span>មិនទាន់មានគណនី?</span>
                                    <a href="customer_register.html" class="link bazaar">បង្កើតគណនី</a>
                                </div>
                                <div class="social-login">
                                    <button type="button" class="social-btn google-btn">
                                        <img src="assets/img/google-original.svg" alt="">បន្តជាមួយ Google
                                    </button>

                                    <button type="button" class="social-btn facebook-btn">
                                        <img src="assets/img/facebook-original.svg"
                                            alt="">បន្តជាមួយ Facebook
                                    </button>

                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
        // Example starter JavaScript for disabling form submissions if there are invalid fields
        (() => {
            'use strict'

            // Fetch all the forms we want to apply custom Bootstrap validation styles to
            const forms = document.querySelectorAll('.needs-validation')

            // Loop over them and prevent submission
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>

</html>
