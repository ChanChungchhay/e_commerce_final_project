<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="shortcut icon" href="assets/img/logo/img-logo.png">
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="assets/css/register.css">
    <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Battambang:wght@100;300;400;700;900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!-- Bootstrap Icon link -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="sec-authentication py-3 py-lg-5 p-lg-5">
        <!-- Background -->
        <div class="background">
            <div class="blur blur-1"></div>
            <div class="blur blur-2"></div>
            <div class="blur blur-3"></div>
            <div class="blob blob-1"></div>
            <div class="blob blob-2 d-lg-block"></div>
        </div>
        <div class="container mb-5">
            <div class="row">
                <div class="col-12 col-lg-6">
                    <div class="mt-2 d-flex justify-content-evenly align-items-center">
                        <h1 class="title fw-bold">សូមស្វាគមន៍មកកាន់ <br><span class="text-success">Khmer<span class="bazaar"> Bazaar</span>.</span></h1>
                        <img src="assets/img/logo-removebg-preview.png" class="img-logo" alt="">
                    </div>
                    <img src="assets/img/register_img.png" class="w-100" alt="">
                </div>
                <div class="col-12 col-lg-6">
                    <div class="card-register border-0">
                        <h2 class="mt-5 login-title text-center fw-bold bazaar">ចូលប្រើប្រាស់</h2>
                        <div class="card border-0 mt-5">
                            <div class="choice border border-2 border-secondary rounded-4 mb-5">
                                <a href="customer_register.html" class="link d-flex align-items-center p-4 text-decoration-none gap-4">
                                    <div class="icon-type"><i class="bi bi-person-fill customer"></i></div>
                                    <div class="descripe">
                                        <div class="title-choice">អតិថិជន</div>
                                        <div class="sub-title small">ចាប់ផ្តើមចុះឈ្មោះជាគណនីអតិថិជន</div>
                                    </div>
                                </a>
                            </div>
                            <div class="choice border border-2 border-secondary rounded-4">
                                <a href="seller_register.html" class="link d-flex align-items-center p-4 text-decoration-none gap-4">
                                    <div class="icon-type"><i class="bi bi-shop-window seller"></i></div>
                                    <div class="descripe">
                                        <div class="title-choice">អាជីវករ</div>
                                        <div class="sub-title">ចាប់ផ្តើមចុះឈ្មោះជាគណនីអាជីវករ</div>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
        // Example starter JavaScript for disabling form submissions if there are invalid fields
        (() => {
            'use strict'

            // Fetch all the forms we want to apply custom Bootstrap validation styles to
            const forms = document.querySelectorAll('.needs-validation')

            // Loop over them and prevent submission
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>

</html>
